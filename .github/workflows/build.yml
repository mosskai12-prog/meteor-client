name: Build Fizzy Client

on:
  push:
    branches: [fizzy-rewrite, fizzy-ui-rework]
  pull_request:
    branches: [fizzy-rewrite]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Build
        run: ./gradlew build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Fizzy-Client
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
